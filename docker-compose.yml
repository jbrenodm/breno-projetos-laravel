services:
  app:
    build: .
    volumes:
      - ./:/var/www/app
    ports:
      - "8000:8000"   # Laravel
      - "5173:5173"   # Vite
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: breno_projetos_laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: