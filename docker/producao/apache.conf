ServerTokens Prod
ServerSignature Off
ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Na imagem oficial esses arquivos apontam para a saída do container (docker compose logs).
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
